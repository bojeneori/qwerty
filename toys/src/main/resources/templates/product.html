<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' | ToyStore'">Товар | ToyStore</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- ВСТАВКА HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container product-page">
    <div style="width: 100%;">

        <div class="product-container" th:classappend="${product.quantityInStock == 0 ? 'out-of-stock' : ''}">

            <div th:if="${product.quantityInStock == 0}" class="product-blocker"></div>

            <div class="product-gallery">
                <div class="main-image"
                     th:data-stock="${product.quantityInStock > 0}"
                     onclick="if(this.getAttribute('data-stock') === 'true') openModal()">
                    <img th:src="${product.mainImageUrl}"
                         alt="Main image"
                         id="mainImage"
                         onerror="this.src='https://via.placeholder.com/600x600?text=No+Image'">
                </div>
                <div class="thumbnail-list" id="thumbnailList">
                    <div class="thumbnail active" th:attr="data-image=${product.mainImageUrl}">
                        <img th:src="${product.mainImageUrl}"
                             alt="Thumbnail 1"
                             onerror="this.src='https://via.placeholder.com/100x100?text=No+Image'">
                    </div>
                    <div th:each="image : ${product.images}"
                         th:if="${image.id != product.mainImage}"
                         class="thumbnail"
                         th:attr="data-image=${image.imageUrl}">
                        <img th:src="${image.imageUrl}">
                    </div>
                </div>
            </div>

            <div class="product-info">

                <h1 th:text="${product.name}"></h1>

                <div class="product-price">
                    <span th:text="${product.price}"></span> ₽
                </div>

                <div class="stock-status"
                     th:classappend="${product.quantityInStock == 0 ? 'out-of-stock-status' : 'in-stock-status'}">
                    <span th:if="${product.quantityInStock > 0}">
                        В наличии: <span th:text="${product.quantityInStock}"></span> шт.
                    </span>
                    <span th:if="${product.quantityInStock == 0}">
                        Нет в наличии
                    </span>
                </div>

                <div class="product-description" th:if="${product.description != null}">
                    <h3>Описание</h3>
                    <p th:text="${product.description}"></p>
                </div>

                <hr/>
                <div class="action-buttons">
                    <th:block th:if="${product.quantityInStock > 0}">
                        <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                            <button type="submit">В корзину</button>
                        </form>
                        <form th:action="@{/reservation/{id}(id=${product.id})}" method="post">
                            <button type="submit">Забронировать</button>
                        </form>
                    </th:block>

                    <th:block th:unless="${product.quantityInStock > 0}">
                        <button type="button" disabled class="disabled-btn">Нет в наличии</button>
                        <button type="button" disabled class="disabled-btn">Недоступно</button>
                    </th:block>
                </div>

            </div>
        </div>
    </div>
</div>

<div id="imageModal" class="modal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImage" alt="Увеличенное изображение">
</div>

<!-- ВСТАВКА FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    // Глобальные переменные
    let currentImage = null;
    let quantityInput = null;
    let cartQuantity = null;
    let reserveQuantity = null;
    let isInStock = false;

    function initThumbnails() {
        // Находим элементы после полной загрузки страницы
        currentImage = document.getElementById('mainImage');
        quantityInput = document.getElementById('quantity');
        cartQuantity = document.getElementById('cartQuantity');
        reserveQuantity = document.getElementById('reserveQuantity');

        const mainImageDiv = document.querySelector('.main-image');
        isInStock = mainImageDiv ? mainImageDiv.getAttribute('data-stock') === 'true' : false;

        if (!isInStock) return;

        // Находим все миниатюры и добавляем обработчики
        let thumbnails = document.querySelectorAll('.thumbnail');
        console.log('Найдено миниатюр:', thumbnails.length); // Для отладки

        thumbnails.forEach((thumb, index) => {
            // Удаляем старые обработчики, если есть
            thumb.removeEventListener('click', thumbClickHandler);
            // Добавляем новый обработчик
            thumb.addEventListener('click', thumbClickHandler);
        });
    }

    // Отдельная функция-обработчик для клика по миниатюре
    function thumbClickHandler() {
        let imageUrl = this.getAttribute('data-image');
        if (imageUrl && isInStock) {
            changeImage(this, imageUrl);
        }
    }

    function changeImage(thumbnailElement, imageUrl) {
        if (!isInStock || !currentImage) return;
        currentImage.src = imageUrl;

        let thumbnails = document.querySelectorAll('.thumbnail');
        thumbnails.forEach(thumb => thumb.classList.remove('active'));
        thumbnailElement.classList.add('active');
    }

    function openModal() {
        if (!isInStock) {
            showNotification('Товар временно недоступен');
            return;
        }
        if (!currentImage) return;

        let modal = document.getElementById('imageModal');
        let modalImage = document.getElementById('modalImage');
        modalImage.src = currentImage.src;
        modal.classList.add('active');
    }

    function closeModal() {
        let modal = document.getElementById('imageModal');
        if (modal) {
            modal.classList.remove('active');
        }
    }

    function showNotification(message) {
        let toast = document.getElementById('toastNotification');
        if (!toast) {
            let notification = document.createElement('div');
            notification.id = 'toastNotification';
            notification.className = 'toast-notification';
            document.body.appendChild(notification);
            toast = notification;
        }
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function updateQuantityFields() {
        if (!isInStock || !quantityInput) return;
        let quantity = quantityInput.value;
        if (cartQuantity) cartQuantity.value = quantity;
        if (reserveQuantity) reserveQuantity.value = quantity;
    }

    // Инициализация при полной загрузке DOM
    document.addEventListener('DOMContentLoaded', function() {
        initThumbnails();

        // Обработчики для кнопок корзины/бронирования
        document.querySelectorAll('.btn-cart, .btn-reserve').forEach(button => {
            button.addEventListener('click', function(e) {
                if (this.disabled || !isInStock) {
                    e.preventDefault();
                    showNotification('Товар временно недоступен');
                    return;
                }

                let message = this.classList.contains('btn-cart')
                    ? 'Товар добавлен в корзину!'
                    : 'Товар забронирован!';

                setTimeout(() => showNotification(message), 100);
            });
        });

        // Обработчик для количества
        if (quantityInput && isInStock) {
            quantityInput.addEventListener('change', function() {
                let value = parseInt(this.value);
                let min = parseInt(this.getAttribute('min')) || 1;
                let max = parseInt(this.getAttribute('max')) || 99;
                if (isNaN(value) || value < min) this.value = min;
                else if (value > max) this.value = max;
                updateQuantityFields();
            });
            updateQuantityFields();
        }
    });

    // Обработчик клавиши Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    // Дополнительная инициализация для динамически загружаемого контента
    window.addEventListener('load', function() {
        // Повторная инициализация на случай, если DOMContentLoaded сработал слишком рано
        initThumbnails();
    });
</script>

</body>
</html>
