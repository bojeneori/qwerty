<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление категориями</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .admin-categories-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .admin-header h1 {
            margin-bottom: 0;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .category-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid #FAD5DF;
            transition: all 0.3s ease;
            position: relative;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(241, 163, 182, 0.15);
            border-color: #7EC8E0;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .category-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #4A3B2C;
            margin: 0;
        }

        .category-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.3rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            color: #E88DA5;
        }

        .btn-icon:hover {
            background: #FEF5F7;
            transform: scale(1.1);
        }

        .options-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #FAD5DF;
        }

        .options-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #E88DA5;
            margin-bottom: 0.5rem;
        }

        .options-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .option-badge {
            background: #FEF5F7;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            color: #E88DA5;
            border: 1px solid #FAD5DF;
        }

        .btn-add-option {
            background: white;
            border: 1px dashed #FAD5DF;
            color: #7EC8E0;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add-option:hover {
            background: #7EC8E0;
            color: white;
            border-color: #7EC8E0;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 20px;
            border: 1px solid #FAD5DF;
            color: #999;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 28px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }

        .modal-content input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #FAD5DF;
            border-radius: 16px;
            margin: 1rem 0;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        @media (max-width: 768px) {
            .categories-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
<body class="admin-page">

<div th:replace="~{fragments/header :: header}"></div>

<div class="admin-categories-container">

    <div class="admin-header">
        <h1>Управление категориями</h1>

        <a th:href="@{/admin/categories/create}"
           class="button"
           style="text-decoration: none;">
            Добавить категорию
        </a>
    </div>

    <div class="categories-grid">

        <div th:each="category : ${categories}"
             class="category-card">

            <div class="category-header">

                <h3 class="category-name"
                    th:text="${category.name}">
                </h3>

                <div class="category-actions">

                    <button type="button"
                            class="btn-icon"
                            th:attr="data-id=${category.id},data-name=${category.name}"
                            onclick="showAddOptionModal(this)"
                            title="Добавить опцию">
                        Добавить
                    </button>

                    <a th:href="@{/admin/categories/edit/{id}(id=${category.id})}"
                       class="btn-icon"
                       title="Редактировать">
                        Редактировать
                    </a>

                    <form th:action="@{/admin/categories/delete/{id}(id=${category.id})}"
                          method="post"
                          style="display:inline;"
                          onsubmit="return confirm('Вы уверены, что хотите удалить категорию? Все связанные опции будут удалены.');">

                        <button type="submit"
                                class="btn-icon"
                                title="Удалить">
                            Удалить
                        </button>
                    </form>

                </div>
            </div>

            <div class="options-section">

                <div class="options-title">
                    Опции категории:
                </div>

                <div class="options-list">

                    <div th:each="option : ${category.options}"
                         class="option-badge">

                        <span th:text="${option.value}"></span>

                        <form th:action="@{/admin/categories/options/delete/{optionId}(optionId=${option.id})}"
                              method="post"
                              style="display:inline;"
                              onsubmit="return confirm('Удалить опцию?');">

                            <button type="submit"
                                    class="btn-icon"
                                    style="font-size:0.7rem;margin-left:0.5rem;">
                                ×
                            </button>
                        </form>

                    </div>

                    <div th:if="${#lists.isEmpty(category.options)}"
                         class="option-badge"
                         style="opacity:0.6;">
                        Нет опций
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div th:if="${#lists.isEmpty(categories)}"
         class="empty-state">

        <h3>Категории не найдены</h3>

        <p>Добавьте первую категорию</p>

        <a th:href="@{/admin/categories/create}"
           class="button"
           style="display:inline-block;margin-top:1rem;">
            Добавить категорию
        </a>

    </div>

</div>

<!-- Модальное окно добавления опции -->
<div id="optionModal" class="modal">

    <div class="modal-content">

        <h3>Добавить опцию</h3>

        <p>
            Категория:
            <span id="modalCategoryName"></span>
        </p>

        <form id="optionForm" method="post">

            <input type="text"
                   id="optionValue"
                   name="value"
                   placeholder="Значение опции"
                   required>

            <div class="modal-buttons">

                <button type="button"
                        class="btn-cancel-modern"
                        onclick="closeModal()">
                    Отмена
                </button>

                <button type="submit"
                        class="btn-submit-modern">
                    Добавить
                </button>

            </div>

        </form>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>

    function showAddOptionModal(button) {

        const categoryId = button.dataset.id;
        const categoryName = button.dataset.name;

        document.getElementById('modalCategoryName').textContent = categoryName;

        document.getElementById('optionForm').action =
            '/admin/categories/' + categoryId + '/options/add';

        document.getElementById('optionValue').value = '';

        document.getElementById('optionModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('optionModal').classList.remove('active');
    }

    window.onclick = function(event) {

        const modal = document.getElementById('optionModal');

        if (event.target === modal) {
            closeModal();
        }
    };

</script>

</body>
</html>
